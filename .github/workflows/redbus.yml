name: Redbus Automated Seat Checker

on:
  push:
    branches: [ main ]
  schedule:
    # Triggers every 5 minutes (Node.js script monitors continuously for 5 minutes per run)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Select Route Phase (or auto for time-based schedule)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
          - '3'
      mode:
        description: 'Execution Mode'
        required: false
        default: 'cloud-monitor'
        type: choice
        options:
          - 'cloud-monitor'
          - 'once'
  repository_dispatch:
    types: [ cloudflare-trigger, trigger, redbus-trigger, run-automation, webhook ]

jobs:
  check-and-book:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Redbus Seat Monitoring
        run: |
          PHASE_INPUT="${{ github.event.inputs.phase || github.event.client_payload.phase || 'auto' }}"
          MODE_INPUT="${{ github.event.inputs.mode || github.event.client_payload.mode || 'cloud-monitor' }}"
          
          if [ -z "$PHASE_INPUT" ]; then PHASE_INPUT="auto"; fi
          if [ -z "$MODE_INPUT" ]; then MODE_INPUT="cloud-monitor"; fi
          
          CMD="node index.js"
          
          if [ "$MODE_INPUT" = "once" ]; then
            CMD="$CMD --once"
          else
            CMD="$CMD --max-duration 5"
          fi
          
          if [ "$PHASE_INPUT" != "auto" ] && [ -n "$PHASE_INPUT" ]; then
            CMD="$CMD --phase $PHASE_INPUT"
          fi
          
          echo "=================================================="
          echo "Triggered Event Name: ${{ github.event_name }}"
          echo "Executing Cloud Automation: $CMD"
          echo "Selected Phase: $PHASE_INPUT"
          echo "Selected Mode : $MODE_INPUT"
          echo "=================================================="
          
          $CMD

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbus-screenshots
          path: screenshots/

