name: Redbus Automated Seat Checker

on:
  push:
    branches: [ main ]
  schedule:
    # Triggers every 5 minutes (Node.js script monitors continuously for 5 minutes per run)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-and-book:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run 5-Minute Active Seat Monitoring
        run: npm run cloud-monitor

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbus-screenshots
          path: screenshots/
